workloads:
  chat:
    input_tokens: 256
    output_tokens: 256
  rag:
    input_tokens: 4096
    output_tokens: 128
  coding:
    shared_prefix_tokens: 2048
    input_tokens: 256       # the unique question
    output_tokens: 256

load:
  concurrency: [1, 4, 16, 32, 64, 128, 256]
  request_rate: [2, 4, 8, 16, 32]    # requests per second

models:
  llama8b-bf16:
    id: meta-llama/Llama-3.1-8B-Instruct
    max_model_len: 8192
  llama8b-fp8:
    id: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8
    max_model_len: 8192
  llama70b-fp8:
    id: RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8
    max_model_len: 8192

images:
  vllm: vllm/vllm-openai:v0.31.0
  sglang: lmsysorg/sglang:v0.5.22

blocks:
  core:
    gpus: 1
    frameworks: [vllm, sglang]
    models: [llama8b-bf16]
    tp: [1]
    workloads: [chat, rag, coding]
  precision:
    gpus: 1
    frameworks: [vllm, sglang]
    models: [llama8b-fp8]
    tp: [1]
    workloads: [chat, rag]
  prefix_off:
    gpus: 1
    frameworks: [vllm, sglang]
    models: [llama8b-bf16]
    tp: [1]
    prefix_cache: [false]
    workloads: [coding]
  tp8b:
    gpus: 2
    frameworks: [vllm, sglang]
    models: [llama8b-bf16]
    tp: [2]
    workloads: [chat]
  tp70b:
    gpus: 4
    frameworks: [vllm, sglang]
    models: [llama70b-fp8]
    tp: [2, 4]
    workloads: [chat]

budget:
  usd_per_gpu_hour: 3.29
  cap_usd: 250
  estimate:
    server_start_min: 6
    point_min: 2
